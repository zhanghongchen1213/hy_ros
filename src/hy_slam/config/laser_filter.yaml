# 激光雷达数据过滤配置文件
# 用于滤除机器人自身结构遮挡或特定区域的雷达点云
# 典型用途：滤除机器人车身内部或后方的雷达数据，避免将自身结构误认为障碍物

scan_to_scan_filter_chain:
  ros__parameters:
    filter1:
      name: rear_box_filter
      type: laser_filters/LaserScanBoxFilter
      params:
        # 过滤框参考坐标系 (通常为 base_link 或 laser_link)
        box_frame: base_link

        # 过滤框范围定义 (单位: 米)
        # 这是一个矩形盒状区域，定义了需要过滤的空间范围
        max_x: -0.1 # X轴最大值 (前方为正)
        min_x: -1.0 # X轴最小值 (后方为负)
        max_y: 0.3 # Y轴最大值 (左侧为正)
        min_y: -0.3 # Y轴最小值 (右侧为负)
        max_z: 1.0 # Z轴最大值 (上方为正)
        min_z: -1.0 # Z轴最小值 (下方为负)

        # 过滤模式
        # false: 删除框内的点 (用于滤除车身)
        # true:  仅保留框内的点 (删除框外的点)
        invert: false
